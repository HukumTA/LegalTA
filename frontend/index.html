  <!-- Critical Anti-FOUC, Trackpad-friendly Scroll & Safeguard Styles -->
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }
    html {
      margin: 0;
      padding: 0;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0F172A;
      background-color: #FAFAFC;
      overflow-x: clip;
      min-height: 100vh;
      touch-action: pan-y;
    }
    /* Prevent flash of unstyled content or mobile drawer popup before Tailwind & SPA initialize */
    body:not(.app-ready) #navbar-container,
    body:not(.app-ready) #app,
    body:not(.app-ready) #footer-container {
      opacity: 0;
    }
    body.app-ready #navbar-container,
    body.app-ready #app,
    body.app-ready #footer-container {
      opacity: 1;
      transition: opacity 0.18s ease-out;
    }
    /* Hard guarantee: mobile drawer & overlay are strictly hidden unless explicitly opened */
    #mobileDrawer {
      display: none !important;
      pointer-events: none !important;
    }
    #mobileDrawer.is-open {
      display: flex !important;
      pointer-events: auto !important;
    }
    #mobileOverlay {
      display: none !important;
      pointer-events: none !important;
    }
    #mobileOverlay.is-open {
      display: block !important;
      pointer-events: auto !important;
    }
    /* Desktop dropdown safeguard with zero gap & invisible hover bridge */
    .nav-dropdown-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.18s;
    }
    /* Invisible hover bridge to eliminate gap between button and panel */
    .nav-dropdown-panel::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 0;
      width: 100%;
      height: 20px;
      background: transparent;
      display: block;
    }
    .nav-dropdown-group:hover .nav-dropdown-panel,
    .nav-dropdown-group.is-hovered .nav-dropdown-panel,
    .nav-dropdown-group.is-open .nav-dropdown-panel,
    .nav-dropdown-group:focus-within .nav-dropdown-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }
    .nav-dropdown-group:hover .dropdown-chevron,
    .nav-dropdown-group.is-hovered .dropdown-chevron,
    .nav-dropdown-group.is-open .dropdown-chevron {
      transform: rotate(180deg);
      color: #7F1517;
    }
    /* Prevent Material Symbols ligature text expansion before font loads */
    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      width: 1em;
      height: 1em;
      overflow: hidden;
      flex-shrink: 0;
    }
    .gold-gradient-text {
      background: linear-gradient(135deg, #B08514 0%, #E6B800 50%, #B08514 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .crimson-gradient-bg {
      background: linear-gradient(135deg, #7F1517 0%, #570005 100%);
    }
    /* FAQ Accordion smooth transition */
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease, padding 0.28s ease;
    }
    .faq-item.active .faq-answer {
      max-height: 360px;
    }
    .faq-item.active .faq-icon {
      transform: rotate(180deg);
    }
  </style>
