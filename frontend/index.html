<head>

  <!-- Critical Anti-FOUC, Trackpad-friendly Scroll & Safeguard Styles -->
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      padding: 0;
      touch-action: pan-y;
      -webkit-overflow-scrolling: touch;
    }

    /* Latar belakang dikembalikan sepenuhnya seperti semula */
    body {
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #0F172A;
      background-color: #FFF7ED;
      background-image:
        radial-gradient(ellipse 60% 40% at 0% 0%, rgba(230, 184, 0, 0.22) 0px, transparent 70%),
        radial-gradient(ellipse 55% 45% at 100% 8%, rgba(127, 21, 23, 0.20) 0px, transparent 70%),
        radial-gradient(ellipse 50% 40% at 10% 55%, rgba(230, 184, 0, 0.16) 0px, transparent 70%),
        radial-gradient(ellipse 55% 45% at 95% 75%, rgba(127, 21, 23, 0.18) 0px, transparent 70%),
        radial-gradient(ellipse 50% 40% at 30% 100%, rgba(230, 184, 0, 0.18) 0px, transparent 70%),
        linear-gradient(180deg, #FFFFFF 0%, #FFF8EC 30%, #FFEFE8 60%, #FBE9EC 85%, #FFF8F1 100%);
      background-attachment: fixed;
      overflow-x: clip;
      min-height: 100vh;
      touch-action: pan-y;
    }

    /* Prevent flash of unstyled content or mobile drawer popup before Tailwind & SPA initialize */
    body:not(.app-ready) #navbar-container,
    body:not(.app-ready) #app,
    body:not(.app-ready) #footer-container {
      opacity: 0;
    }

    body.app-ready #navbar-container,
    body.app-ready #app,
    body.app-ready #footer-container {
      opacity: 1;
      transition: opacity 0.18s ease-out;
    }

    /* Hard guarantee: mobile drawer & overlay are strictly hidden unless explicitly opened */
    #mobileDrawer {
      display: none !important;
      pointer-events: none !important;
    }

    #mobileDrawer.is-open {
      display: flex !important;
      pointer-events: auto !important;
    }

    #mobileOverlay {
      display: none !important;
      pointer-events: none !important;
    }

    #mobileOverlay.is-open {
      display: block !important;
      pointer-events: auto !important;
    }

    /* Desktop dropdown safeguard with zero gap & invisible hover bridge */
    .nav-dropdown-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(4px);
      transition: opacity 0.18s cubic-bezier(0.16, 1, 0.3, 1), transform 0.18s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.18s;
    }

    .nav-dropdown-panel::before {
      content: '';
      position: absolute;
      top: -16px;
      left: 0;
      width: 100%;
      height: 20px;
      background: transparent;
      display: block;
    }

        .nav-dropdown-panel {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(6px);
      transition: opacity 0.16s ease-out, transform 0.16s ease-out, visibility 0.16s ease-out;
      z-index: 60;
    }

    .nav-dropdown-group.is-hovered .nav-dropdown-panel,
    .nav-dropdown-group.is-open .nav-dropdown-panel {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .dropdown-chevron {
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), color 0.2s ease;
    }

    .nav-dropdown-group.is-hovered .dropdown-chevron,
    .nav-dropdown-group.is-open .dropdown-chevron {
      transform: rotate(180deg);
      color: #7F1517;
    }

    .material-symbols-outlined {
      font-family: 'Material Symbols Outlined';
      font-weight: normal;
      font-style: normal;
      line-height: 1;
      letter-spacing: normal;
      text-transform: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      word-wrap: normal;
      direction: ltr;
      -webkit-font-smoothing: antialiased;
      width: 1em;
      height: 1em;
      overflow: hidden;
      flex-shrink: 0;
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #B08514 0%, #E6B800 50%, #B08514 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .crimson-gradient-bg {
      background: linear-gradient(135deg, #7F1517 0%, #570005 100%);
    }

    .bg-section-warm {
      background:
        radial-gradient(ellipse 50% 60% at 0% 0%, rgba(230, 184, 0, 0.18), transparent 70%),
        linear-gradient(180deg, #FFFBF2 0%, #FFF3E2 100%);
    }

    .bg-section-rose {
      background:
        radial-gradient(ellipse 50% 60% at 100% 0%, rgba(127, 21, 23, 0.14), transparent 70%),
        linear-gradient(180deg, #FFFFFF 0%, #FDF0F2 100%);
    }

    .bg-section-dark {
      background:
        radial-gradient(ellipse 60% 70% at 85% 0%, rgba(230, 184, 0, 0.22), transparent 65%),
        linear-gradient(135deg, #7F1517 0%, #450A0C 100%);
    }

    .bg-dots {
      background-image: radial-gradient(rgba(127, 21, 23, 0.12) 1px, transparent 1px);
      background-size: 22px 22px;
    }

    .divider-glow {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(176, 133, 20, 0.6), transparent);
    }

    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.28s ease, padding 0.28s ease;
    }

    .faq-item.active .faq-answer {
      max-height: 360px;
    }

    .faq-item.active .faq-icon {
      transform: rotate(180deg);
    }
  </style>

  <!-- Tailwind CSS CDN -->

  <!-- Fungsi Global Toggle Dark Mode (Opsional jika ingin dipakai nanti) -->
  <script>
    window.toggleDarkMode = function () {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    };
  </script>

  <!-- Global Toast Notifications Container -->
  <div id="toast-container" class="fixed bottom-20 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Auto-render ikon Lucide -->
  <script>
    (function () {
      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons();
        }
      }
      window.addEventListener("load", function () {
        var targets = ["app", "navbar-container", "footer-container"]
          .map(function (id) { return document.getElementById(id); })
          .filter(Boolean);
        var timer;
        if (window.MutationObserver) {
          var observer = new MutationObserver(function () {
            clearTimeout(timer);
            timer = setTimeout(refreshIcons, 30);
          });
          targets.forEach(function (el) {
            observer.observe(el, { childList: true, subtree: true });
          });
        }
        refreshIcons();
      });
    })();
  </script>

  <!-- SPA Router Entrypoint -->
  <script type="module" src="js/app.js"></script>
</body>
